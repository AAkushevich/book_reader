name: book_reader_app
description: "Clean reader app with Riverpod"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  
  # State Management (выровнены до одной версии)
  flutter_riverpod: ^3.0.3
  riverpod_annotation: ^3.0.3
  
  # Parsing
  xml: ^6.5.0
  archive: ^3.6.1
  
  # Storage (чистый Dart, без кодогенерации)
  sembast: ^3.8.2
  
  # Utils
  path: ^1.9.0
  path_provider: ^2.1.5
  file_picker: ^11.0.2
  equatable: ^2.0.7
  logger: ^2.6.2
  collection: ^1.19.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  riverpod_generator: ^3.0.3

flutter:
  uses-material-design: true